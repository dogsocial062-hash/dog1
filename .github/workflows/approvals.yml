name: Approvals

on:
  schedule:
    - cron: "*/5 * * * *"   # checks Telegram for Approve / Skip taps
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approvals
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Process Telegram taps
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.process_approvals
      - name: Save state
        if: always()
        run: |
          git config user.name "kona-bot"
          git config user.email "kona-bot@users.noreply.github.com"
          git add state/status.json
          git diff --cached --quiet || (git commit -m "Update post status" && git pull --rebase -q && git push -q)
